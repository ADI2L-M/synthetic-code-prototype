[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14213D"
font = "sans-serif"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14213D"
borderColor = "#CBD5E1"
dataframeBorderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#EAF0F7"
chartCategoricalColors = ["#2563EB", "#7C3AED", "#16A34A", "#D97706", "#DC2626"]

[theme.light.sidebar]
backgroundColor = "#EAF0F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17233D"
primaryColor = "#2563EB"
borderColor = "#CBD5E1"

[theme.dark]
primaryColor = "#79A8FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#F3F6FB"
borderColor = "#374151"
dataframeBorderColor = "#374151"
dataframeHeaderBackgroundColor = "#202733"
chartCategoricalColors = ["#79A8FF", "#C4A7FF", "#4ADE80", "#FBBF24", "#FB7185"]

[theme.dark.sidebar]
backgroundColor = "#111827"
secondaryBackgroundColor = "#202733"
textColor = "#EEF2FF"
primaryColor = "#79A8FF"
borderColor = "#374151"
